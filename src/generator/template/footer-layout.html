<script type="text/javascript">
var murottalAudioElement = document.createElement('Audio');
var previousPlayedButton = null;
var murottalLoopMode = 'noloop';
var ayahSelection = [];

var FONT_SCALE_DEFAULT = 100;
var FONT_SCALE_MIN = 50;
var FONT_SCALE_MAX = 200;
var FONT_SCALE_STEP = 10;
var currentFontScale = FONT_SCALE_DEFAULT;

/**
 * Apply font size scaling to content elements.
 *
 * @param int scale  Percentage scale, e.g. 100 = default, 110 = 10% larger
 * @return void
 */
function applyFontSize(scale)
{
    var classes = [
        { name: 'ayah-text',         base: 1.6 },
        { name: 'ayah-translation',  base: 1.0 },
        { name: 'ayah-tafsir',       base: 1.0 },
        { name: 'ayah-tafsir-title', base: 1.3 },
        { name: 'label-goto-ayah',   base: 0.9 },
        { name: 'goto-ayah',         base: 0.8 },
        { name: 'surah-index-name',  base: 1.2 },
        { name: 'surah-index-ayah',  base: 0.75 },
        { name: 'surah-index-number',base: 1.2 },
        { name: 'favorite-ayah-link',base: 0.95 }
    ];
    for (var c = 0; c < classes.length; c++) {
        var els = document.getElementsByClassName(classes[c].name);
        var size = (classes[c].base * scale / 100).toFixed(2) + 'em';
        for (var i = 0; i < els.length; i++) {
            els[i].style.fontSize = size;
        }
    }
    currentFontScale = scale;

    // Update indicator
    var indicator = document.getElementById('font-size-indicator');
    if (indicator !== null) {
        indicator.innerHTML = scale + '%';
    }
}

var afterAudioDoneCallback = function(e) {
    // &#x25b6; black right triangle
    var surahNumber = e.target.myCustomData.surahNumber;
    var ayahNumber = e.target.myCustomData.ayahNumber;
    var audioButton = e.target.myCustomData.audioButton;
    audioButton.innerHTML = '<span class="icon-content">&#x25b6;</span>';

    murottalAudioElement.loop = false;
    if (murottalLoopMode === 'surah') {
        if (audioButton.getAttribute('data-from-tafsir-page') == "1") {
            return;
        }

        var nextAyah = audioButton.getAttribute('data-next-ayah-number');
        if (audioButton.getAttribute('data-is-last-ayah') == "1") {
            nextAyah = 1;
        }
        document.getElementById('audio-' + surahNumber + '-' + nextAyah).click();

        // do not scroll if we are opening side menu
        if (window.location.hash.indexOf('#sidepage') == -1) {
            window.location.href = '#no' + nextAyah;
        }
    }

    if (murottalLoopMode === 'ayah-selection') {
        if (audioButton.getAttribute('data-from-tafsir-page') == "1") {
            return;
        }

        var currentIndexPosition = ayahSelection.indexOf(parseInt(ayahNumber));
        var nextAyah = ayahSelection[currentIndexPosition + 1];

        if (currentIndexPosition + 1 === ayahSelection.length) {
            nextAyah = ayahSelection[0];
        }

        // Prevent unknown ayat to be played
        if (document.getElementById('audio-' + surahNumber + '-' + nextAyah) === null) {
            return;
        }

        document.getElementById('audio-' + surahNumber + '-' + nextAyah).click();

        // do not scroll if we are opening side menu
        if (window.location.hash.indexOf('#sidepage') == -1) {
            window.location.href = '#no' + nextAyah;
        }
    }
}

/**
 * Function to pad string at beginning. With modification without String.repeat().
 *
 * https://github.com/uxitten/polyfill/blob/master/string.polyfill.js
 * https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/padStart
 *
 * @return String
 */
if (!String.prototype.padStart) {
    String.prototype.padStart = function padStart(targetLength, padString) {
        var targetLength = targetLength >> 0; //truncate if number, or convert non-number to 0;
        var padString = String(typeof padString !== 'undefined' ? padString : ' ');
        if (this.length >= targetLength) {
            return String(this);
        } else {
            targetLength = targetLength - this.length;
            var prefix = '';
            for (var i=0; i<targetLength; i++) {
                prefix += padString;
            }

            return prefix + String(this);
        }
    };
}

/**
 * @param String $value
 * @return Array
 */
function parseAyahSelection(value)
{
    var tmpSelection = [];
    var ayahSelection = [];

    var tmp = value.split(',');
    for (var i=0; i<tmp.length; i++) {
        if (tmp[i].indexOf('-') > -1) {
            var tmp2 = tmp[i].split('-');
            var start = parseInt(tmp2[0]);
            var end = parseInt(tmp2[1]);

            for (var j=start; j<=end; j++) {
                tmpSelection.push(j);
            }

            continue;
        }

        tmpSelection.push(parseInt(tmp[i]));
    }

    // Remove duplicate
    for (var i=0; i<tmpSelection.length; i++) {
        if (ayahSelection.indexOf(tmpSelection[i]) !== -1) {
            continue;
        }

        ayahSelection.push(tmpSelection[i]);
    }

    // Sort from lowest to highest
    return ayahSelection.sort(function(a, b) {
        return a - b;
    });
}


/**
 * Retrieve a setting from localStorage, with transparent auto-migration from legacy cookies.
 *
 * @param String name
 * @return String|null
 */
function getStorageValue(name)
{
    try {
        var val = localStorage.getItem(name);
        if (val !== null && typeof val !== "undefined") {
            return val;
        }
    } catch (e) {}

    // Auto-migration: read from legacy cookie if present
    if (document.cookie.indexOf(name + "=") >= 0) {
        var match = document.cookie.replace(new RegExp("(?:(?:^|.*;\\s*)" + name + "\\s*\\=\\s*([^;]*).*$)|^.*$"), "$1");
        if (match && match !== "") {
            try { match = decodeURIComponent(match); } catch (e) {}
            try { localStorage.setItem(name, match); } catch (e) {}
            document.cookie = name + "=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT";
            return match;
        }
    }

    return null;
}

/**
 * Check if a storage key exists, optionally checking if its value matches.
 *
 * @param String name
 * @param String value
 * @return boolean
 */
function isStorageExists(name, value)
{
    var val = getStorageValue(name);
    if (val === null) {
        return false;
    }
    if (typeof value === "undefined") {
        return true;
    }
    return val.toString() === value.toString();
}

/**
 * Save a setting to localStorage and clear legacy cookie.
 *
 * @param String name
 * @param String value
 * @param Boolean skipAutoSync
 * @return void
 */
function setStorageValue(name, value, skipAutoSync)
{
    try {
        if (value === null || typeof value === "undefined") {
            localStorage.removeItem(name);
        } else {
            localStorage.setItem(name, value.toString());
        }
    } catch (e) {}

    document.cookie = name + "=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT";

    if (!skipAutoSync) {
        if (name !== "lastRead" && name !== "lastReadJuz" && name !== "quran_sync_code" && name !== "quran_sync_last_time") {
            try {
                localStorage.setItem("quran_settings_updated_at", Date.now().toString());
            } catch (e) {}
        }
        if (typeof triggerAutoSync === "function") {
            triggerAutoSync();
        }
    }
}

// Backward-compatibility aliases
function isCookieExists(name, value) { return isStorageExists(name, value); }
function writePermanentCookie(name, value) { setStorageValue(name, value); }
function getCookieValue(name) { return getStorageValue(name); }

function applyNightMode(apply)
{
    var nightModeCss = 'nightmode';

    if (apply === false) {
        document.body.className = document.body.className.replace(nightModeCss, '');

        setStorageValue('nightMode', '0');
        return;
    }

    document.body.className = document.body.className + ' ' + nightModeCss;

    setStorageValue('nightMode', '1');
}

/**
 * Apply translation
 *
 * @param boolean apply
 * @return void
 */
function applyTranslation(apply)
{
    var notranslationCss = 'notranslation';

    if (apply === true) {
        document.body.className = document.body.className.replace(notranslationCss, '');

        setStorageValue('useTranslation', '1');
        return;
    }

    document.body.className = document.body.className + ' ' + notranslationCss;

    setStorageValue('useTranslation', '0');
}

/**
 * Apply on double click for ayah element
 *
 * @return void
 */
function applyClickForBookmark()
{
    var ayahNumberElements = document.getElementsByClassName('link-mark-ayah');
    var writeMarkedAyah = function(surahName, surahNumber, ayahNumber) {
        var marked = confirm('Tandai sebagai terakhir dibaca Surah ' + surahName + ' ayat ' + ayahNumber + '?');
        if (marked == false) {
            return;
        }

        var lastReadCookieValue = surahName + ',' + surahNumber.toString() + ',' + ayahNumber.toString();
        try {
            localStorage.setItem('quran_last_read_updated_at', Date.now().toString());
        } catch (e) {}
        setStorageValue('lastRead', lastReadCookieValue);

        var elLastMarked = document.getElementById('sidepage-item-last-marked');
        var elLastReadLink = document.getElementById('last-read-link');
        if (elLastMarked) elLastMarked.innerHTML = 'Surah ' + surahName + ' ayat ' + ayahNumber;
        if (elLastReadLink) elLastReadLink.href = '{{BASE_URL}}/' + surahNumber + '/#no' + ayahNumber;

        if (typeof triggerAutoSync === 'function') {
            triggerAutoSync();
        }
    };

    var ayahInfo;
    for (var i=0; i<ayahNumberElements.length; i++) {
        ayahNumberElements[i].onclick = function(e)
        {
            ayahInfo = this.parentNode.parentNode.title.split(',');
            writeMarkedAyah(ayahInfo[0], ayahInfo[1], ayahInfo[2]);

            return false;
        }
    }

    var rawSurah = getStorageValue('lastRead');

    if (!rawSurah) {
        return;
    }

    try { rawSurah = decodeURIComponent(rawSurah); } catch (e) {}
    ayahInfo = rawSurah.split(',');
    if (ayahInfo.length >= 3) {
        var elLastMarked = document.getElementById('sidepage-item-last-marked');
        var elLastReadLink = document.getElementById('last-read-link');
        if (elLastMarked) elLastMarked.innerHTML = 'Surah ' + ayahInfo[0] + ' ayat ' + ayahInfo[2];
        if (elLastReadLink) elLastReadLink.href = '{{BASE_URL}}/' + ayahInfo[1] + '/#no' + ayahInfo[2];
    }
}

/**
 * Audio murottal are taken from everyayah.com. Currently only support one reciter.
 *
 * @param int surahNumber
 * @param int ayahNumber
 * @param HTMLAudioElement audioButton
 * @return void
 */
function playAudioMurottal(surahNumber, ayahNumber, audioButton)
{
    var reciterName = document.getElementById('murottal-reciter').value;
    var baseMurottalUrl = '{{BASE_MUROTTAL_URL}}/' + reciterName + '/';
    var murottalFile = (parseInt(surahNumber) * 1000 + parseInt(ayahNumber)).toString();
    murottalFile = murottalFile.padStart(6, '0') + '.mp3';

    if (previousPlayedButton === audioButton && !murottalAudioElement.ended) {
        if (murottalAudioElement.paused) {
            murottalAudioElement.play();
            // Pause icon using double pipe character
            audioButton.innerHTML = '<span class="icon-content"><b>||</b></span>';
        } else {
            murottalAudioElement.pause();
            // pipe with black triangle icon
            audioButton.innerHTML = '<span class="icon-content">|&#x25b6;</span>';
        }

        return;
    }

    if (previousPlayedButton !== null) {
        // reset button back to Play icon
        previousPlayedButton.innerHTML = '<span class="icon-content">&#x25b6;</span>';
    }
    previousPlayedButton = audioButton;

    murottalAudioElement.src = baseMurottalUrl + murottalFile;
    murottalAudioElement.play();

    if (murottalLoopMode === 'ayah') {
        murottalAudioElement.loop = true;
    }

    // Pause icon using double pipe character
    audioButton.innerHTML = '<span class="icon-content"><b>||</b></span>';
    murottalAudioElement.myCustomData = {
        surahNumber: surahNumber,
        ayahNumber: ayahNumber,
        audioButton: audioButton
    }
    murottalAudioElement.removeEventListener('ended', afterAudioDoneCallback, false);
    murottalAudioElement.addEventListener('ended', afterAudioDoneCallback, false);
}

/**
 * Function apply function to play audio murottal
 *
 * @return void
 */
function applyClickForMurottal()
{
    var clickAudioElements = document.getElementsByClassName('murottal-audio-player');
    for (var i=0; i<clickAudioElements.length; i++) {
        clickAudioElements[i].onclick = function(e)
        {
            playAudioMurottal(
                this.getAttribute('data-surah-number'),
                this.getAttribute('data-ayah-number'),
                this
            );
        }
    }

    var murottalOptionElements = document.getElementsByName('murottal-mode');
    for (var i=0; i<murottalOptionElements.length; i++) {
        murottalOptionElements[i].onclick = function(e) {
            murottalLoopMode = this.value;

            setStorageValue('murottalMode', this.value);

            if (this.value === 'ayah') {
                murottalAudioElement.loop = true;
                return;
            }

            if (this.value === 'ayah-selection' && ayahSelection.length === 0) {
                return;
            }

            murottalAudioElement.loop = false;
        }

        if (isStorageExists('murottalMode', murottalOptionElements[i].value)) {
            murottalOptionElements[i].checked = true;
            murottalLoopMode = murottalOptionElements[i].value;
        }
    }

        var savedAyahSelection = getStorageValue('ayahSelection');
    if (savedAyahSelection) {
        var inputSel = document.getElementById('ayah-selection-input');
        if (inputSel) inputSel.value = savedAyahSelection;
        ayahSelection = parseAyahSelection(savedAyahSelection);
    }

    var savedReciterIndex = getStorageValue('reciterIndex');
    if (savedReciterIndex !== null) {
        var reciterEl = document.getElementById('murottal-reciter');
        if (reciterEl) reciterEl.selectedIndex = parseInt(savedReciterIndex) || 0;
    }}

document.getElementById('murottal-reciter').onchange = function(e)
{
    setStorageValue('reciterIndex', this.selectedIndex);
}

document.getElementById('ayah-selection-input').onkeyup = function(e)
{
    // Regex credit @see https://stackoverflow.com/a/45450540/2566677
    var ayatRegex = new RegExp(/^[0-9]+(?:-[0-9]+)?(,[0-9]+(?:-[0-9]+)?)*$/gm);
    if (!ayatRegex.test(this.value)) {
        this.className = this.className.replace(' input-error', '') + ' input-error';
        return;
    }

    this.className = this.className.replace(' input-error', '');
    ayahSelection = parseAyahSelection(this.value);
    setStorageValue('ayahSelection', this.value);
}

/**
 * Jump to particular ayah when select element changes
 */
var gotoAyahElement = document.getElementById('goto-ayah');
var onAyahPage = false;

if (gotoAyahElement !== null) {
    gotoAyahElement.onchange = function(e) {
        window.location.href = this.value;
    }

    // Apply selected attribute
    var gotoTafsirAyahElement = document.getElementsByClassName('goto-ayah-tafsir');
    if (gotoTafsirAyahElement.length > 0) {
        onAyahPage = true;
        var currentAyah = parseInt(window.location.pathname.split('/')[2]);
        var optionsEl = gotoTafsirAyahElement[0].options;

        for (var i=0; i<optionsEl.length; i++) {
            if (currentAyah - 1 === i) {
                optionsEl[i].selected = true;
            }
        }
    }
}

/**
 * Find the next navigable .ayah sibling on a Juz page.
 * Skips non-.ayah elements (e.g. surah-header-in-juz dividers) and
 * skips .ayah elements without an id (e.g. basmalah).
 *
 * @param Element el  The current .ayah div
 * @return Element|null
 */
function nextJuzAyah(el) {
    var next = el.nextElementSibling;
    while (next !== null) {
        if (next.classList.contains('ayah') && next.id) {
            return next;
        }
        next = next.nextElementSibling;
    }
    return null;
}

// Scroll to next ayah on click — works on both Surah and Juz pages
var allAyah = document.querySelectorAll('.ayah-text');
for (var i=0; i<allAyah.length; i++) {
    allAyah[i].addEventListener('click', function(el) {
        var ayahDiv = this.parentNode;
        // Juz page: ayah divs carry data-juz-number
        if (ayahDiv.getAttribute('data-juz-number') !== null) {
            var next = nextJuzAyah(ayahDiv);
            if (next !== null) {
                window.location.href = '#' + next.id;
            }
            return;
        }
        // Surah page: original behavior
        window.location.href = '#no' + ayahDiv.getAttribute('data-next-ayah-number');
    });
}

// Go to next ayah when press ENTER — works on both Surah and Juz pages
document.onkeyup = function(e) {
    if (e.which === 13) { /* Deprecated - but I need to support my BB10 :) */
        // Juz page: use the same next-sibling logic as the click handler
        var allAyahDivs = document.querySelectorAll('.ayah[data-juz-number]');
        if (allAyahDivs.length > 0) {
            var hash = window.location.hash.replace('#', '');
            var current = hash ? document.getElementById(hash) : null;
            if (current === null) {
                return;
            }
            var next = nextJuzAyah(current);
            if (next !== null) {
                e.preventDefault();
                window.location.href = '#' + next.id;
            }
            return;
        }

        // Surah page: original behavior
        var currentAyah = parseInt(window.location.hash.split('#no')[1]) || 0;
        if (currentAyah === allAyah.length) {
            return;
        }
        e.preventDefault();
        window.location.href = '#no' + (currentAyah + 1);
    }
}

document.getElementById('translation').onclick = function(e)
{
    if (this.checked) {
        applyTranslation(true);
        return;
    }

    applyTranslation(false);
}

document.getElementById('nightmode').onclick = function(e)
{
    if (this.checked) {
        applyNightMode(true);
        return;
    }

    applyNightMode(false);
}

var searchElement = document.getElementById('search-keywords');

if (searchElement !== null) {
    document.getElementById('search-keywords').onkeyup = function(e)
    {
        var surahList = document.getElementsByClassName('surah-index-link');
        var keyword = this.value.toLowerCase();

        for (var i=0; i<surahList.length; i++) {
            surahList[i].parentNode.style.display = 'block';

            if (surahList[i].getAttribute('data-keywords').toLowerCase().indexOf(keyword) === -1) {
                surahList[i].parentNode.style.display = 'none';
            }
        }
    }
}

/**
 * Retrieve list of favorite ayat from localStorage.
 *
 * @return Array
 */
function getFavorites()
{
    try {
        var raw = localStorage.getItem('quran_favorites');
        if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
                return parsed;
            }
        }
    } catch (e) {}
    return [];
}

/**
 * Save list of favorite ayat to localStorage and update menu indicator.
 *
 * @param Array favorites
 * @return void
 */
function saveFavorites(favorites)
{
    try {
        localStorage.setItem('quran_favorites', JSON.stringify(favorites));
        localStorage.setItem('quran_favorites_updated_at', Date.now().toString());
    } catch (e) {}
    updateFavoriteMenuIndicator();
    if (typeof triggerAutoSync === 'function') {
        triggerAutoSync();
    }
}

/**
 * Update the menu sublabel for "Ayat Favorit":
 * "Ada (x) ayat favorit." or "Belum ada. Klik tombol ♥︎ untuk memasukkan ke favorit."
 *
 * @return void
 */
function updateFavoriteMenuIndicator()
{
    var indicator = document.getElementById('sidepage-item-favorite-count');
    if (indicator === null) {
        return;
    }

    var favs = getFavorites();
    if (favs.length === 0) {
        indicator.innerHTML = 'Belum ada. Klik tombol &#x2665;&#xfe0e; untuk memasukkan ke favorit.';
    } else {
        indicator.innerHTML = 'Ada ' + favs.length + ' ayat favorit.';
    }
}

/**
 * Check if a specific ayah is in favorites.
 *
 * @param int|string surahNumber
 * @param int|string ayahNumber
 * @return boolean
 */
function isAyahFavorited(surahNumber, ayahNumber)
{
    var favs = getFavorites();
    var s = parseInt(surahNumber, 10);
    var a = parseInt(ayahNumber, 10);
    for (var i = 0; i < favs.length; i++) {
        if (parseInt(favs[i].surahNumber, 10) === s && parseInt(favs[i].ayahNumber, 10) === a) {
            return true;
        }
    }
    return false;
}

/**
 * Toggle favorite status for an ayah.
 *
 * @param int|string surahNumber
 * @param string surahName
 * @param int|string ayahNumber
 * @param HTMLElement|null buttonEl
 * @return void
 */
function toggleFavorite(surahNumber, surahName, ayahNumber, buttonEl)
{
    var s = parseInt(surahNumber, 10);
    var a = parseInt(ayahNumber, 10);
    var favs = getFavorites();
    var foundIndex = -1;

    for (var i = 0; i < favs.length; i++) {
        if (parseInt(favs[i].surahNumber, 10) === s && parseInt(favs[i].ayahNumber, 10) === a) {
            foundIndex = i;
            break;
        }
    }

    if (foundIndex !== -1) {
        favs.splice(foundIndex, 1);
        saveFavorites(favs);
        if (buttonEl) {
            buttonEl.classList.remove('is-favorite');
            buttonEl.title = 'Tambahkan ke favorit';
        }
    } else {
        favs.push({
            surahNumber: s,
            surahName: surahName || '',
            ayahNumber: a
        });
        saveFavorites(favs);
        if (buttonEl) {
            buttonEl.classList.add('is-favorite');
            buttonEl.title = 'Hapus dari favorit';
        }
    }

    // Sync all matching favorite buttons on the current page
    var allFavBtns = document.getElementsByClassName('link-fav-ayah');
    for (var j = 0; j < allFavBtns.length; j++) {
        var btnS = parseInt(allFavBtns[j].getAttribute('data-surah-number'), 10);
        var btnA = parseInt(allFavBtns[j].getAttribute('data-ayah-number'), 10);
        if (btnS === s && btnA === a) {
            if (foundIndex !== -1) {
                allFavBtns[j].classList.remove('is-favorite');
                allFavBtns[j].title = 'Tambahkan ke favorit';
            } else {
                allFavBtns[j].classList.add('is-favorite');
                allFavBtns[j].title = 'Hapus dari favorit';
            }
        }
    }

    if (typeof renderFavoritesPage === 'function') {
        renderFavoritesPage();
    }
}

/**
 * Bind click handlers and initial state for favorite buttons.
 *
 * @return void
 */
function applyClickForFavorite()
{
    var favButtons = document.getElementsByClassName('link-fav-ayah');
    for (var i = 0; i < favButtons.length; i++) {
        var sNum = favButtons[i].getAttribute('data-surah-number');
        var aNum = favButtons[i].getAttribute('data-ayah-number');

        if (isAyahFavorited(sNum, aNum)) {
            favButtons[i].classList.add('is-favorite');
            favButtons[i].title = 'Hapus dari favorit';
        } else {
            favButtons[i].classList.remove('is-favorite');
            favButtons[i].title = 'Tambahkan ke favorit';
        }

        favButtons[i].onclick = function(e) {
            e.preventDefault();
            var s = this.getAttribute('data-surah-number');
            var name = this.getAttribute('data-surah-name');
            var a = this.getAttribute('data-ayah-number');
            toggleFavorite(s, name, a, this);
            return false;
        };
    }

    updateFavoriteMenuIndicator();
}

/**
 * Render the /favorit/ page list grouped by Surah and ordered by surah/ayah.
 *
 * @return void
 */
function renderFavoritesPage()
{
    var container = document.getElementById('favorite-surah-list');
    var emptyBox = document.getElementById('favorite-empty');
    var headingCount = document.getElementById('favorite-count-heading');
    var searchWrapper = document.getElementById('favorite-search-wrapper');
    if (container === null) {
        return; // Not on /favorit/ page
    }

    var favs = getFavorites();

    if (favs.length === 0) {
        container.innerHTML = '';
        if (emptyBox !== null) emptyBox.style.display = 'block';
        if (searchWrapper !== null) searchWrapper.style.display = 'none';
        if (headingCount !== null) headingCount.innerHTML = '0 Ayat';
        return;
    }

    if (emptyBox !== null) emptyBox.style.display = 'none';
    if (searchWrapper !== null) searchWrapper.style.display = 'block';
    if (headingCount !== null) headingCount.innerHTML = favs.length + ' Ayat';

    // Map for quick surah lookup from allSurahMeta if provided
    var surahInfoMap = {};
    if (typeof allSurahMeta !== 'undefined' && Array.isArray(allSurahMeta)) {
        for (var m = 0; m < allSurahMeta.length; m++) {
            surahInfoMap[allSurahMeta[m].number] = allSurahMeta[m];
        }
    }

    // Sort favorites: Surah asc, then Ayah asc
    favs.sort(function(a, b) {
        var sA = parseInt(a.surahNumber, 10);
        var sB = parseInt(b.surahNumber, 10);
        if (sA !== sB) return sA - sB;
        return parseInt(a.ayahNumber, 10) - parseInt(b.ayahNumber, 10);
    });

    // Group by surahNumber
    var groups = {};
    var groupOrder = [];
    for (var i = 0; i < favs.length; i++) {
        var sNum = parseInt(favs[i].surahNumber, 10);
        if (!groups[sNum]) {
            groups[sNum] = [];
            groupOrder.push(sNum);
        }
        groups[sNum].push(favs[i]);
    }

    var baseUrl = '{{BASE_URL}}';
    var html = '';

    for (var g = 0; g < groupOrder.length; g++) {
        var sNum = groupOrder[g];
        var sMeta = surahInfoMap[sNum] || {};
        var sNameLatin = sMeta.name_latin || groups[sNum][0].surahName || ('Surah ' + sNum);
        var sNameArabic = sMeta.name_arabic || '';

        var keywords = sNameLatin.toLowerCase() + ' ' + sNum;

        html += '<li class="surah-index favorite-surah-group" data-keywords="' + keywords + '">';
        html += '  <div class="favorite-surah-header">';
        html += '    <a class="surah-index-name" href="' + baseUrl + '/' + sNum + '/" title="Buka Surah ' + sNameLatin + '">';
        html += '      ' + sNameLatin + (sNameArabic ? ' - <span class="surah-arabic-title" style="font-family: LPMQ, serif;">' + sNameArabic + '</span>' : '');
        html += '    </a>';
        html += '    <span class="surah-index-number">' + sNum + '</span>';
        html += '  </div>';
        html += '  <ul class="favorite-ayah-list">';

        for (var a = 0; a < groups[sNum].length; a++) {
            var ayahNum = groups[sNum][a].ayahNumber;
            html += '    <li class="favorite-ayah-item">';
            html += '      <a class="favorite-ayah-link" href="' + baseUrl + '/' + sNum + '/#no' + ayahNum + '" title="Buka Surah ' + sNameLatin + ' ayat ' + ayahNum + '">';
            html += '        Ayat ' + ayahNum;
            html += '      </a>';
            html += '      <span class="favorite-ayah-actions">';
            html += '        <a class="favorite-action-link" href="' + baseUrl + '/' + sNum + '/' + ayahNum + '/" title="Tafsir Ayat ' + ayahNum + '">&#x273C; Tafsir</a>';
            html += '        <a href="#" class="favorite-remove-link" title="Hapus Ayat ' + ayahNum + ' dari favorit" data-surah="' + sNum + '" data-ayah="' + ayahNum + '">&#x2715; Hapus</a>';
            html += '      </span>';
            html += '    </li>';
        }

        html += '  </ul>';
        html += '</li>';
    }

    container.innerHTML = html;

    // Attach click events to remove buttons
    var removeButtons = container.getElementsByClassName('favorite-remove-link');
    for (var r = 0; r < removeButtons.length; r++) {
        removeButtons[r].onclick = function(e) {
            e.preventDefault();
            var delSurah = this.getAttribute('data-surah');
            var delAyah = this.getAttribute('data-ayah');
            toggleFavorite(delSurah, '', delAyah, null);
            return false;
        };
    }
}

/**
 * Filter favorite items by keyword.
 *
 * @return void
 */
function applyFavoritesSearch()
{
    var searchInput = document.getElementById('search-favorites');
    if (searchInput === null) return;

    searchInput.onkeyup = function(e) {
        var keyword = this.value.toLowerCase();
        var groups = document.getElementsByClassName('favorite-surah-group');
        for (var i = 0; i < groups.length; i++) {
            var kw = groups[i].getAttribute('data-keywords') || '';
            var text = groups[i].textContent.toLowerCase();
            if (kw.indexOf(keyword) !== -1 || text.indexOf(keyword) !== -1) {
                groups[i].style.display = 'block';
            } else {
                groups[i].style.display = 'none';
            }
        }
    };
}


/**
 * Cloud Sync Feature
 * Integrates with Cloudflare Worker + Cloudflare KV for cross-device sync.
 */
var SYNC_API_URL = '{{SYNC_API_URL}}';

function formatSyncDateTime(d)
{
    var dt = d ? (d instanceof Date ? d : new Date(d)) : new Date();
    if (isNaN(dt.getTime())) {
        return d || "";
    }
    var day = ("0" + dt.getDate()).slice(-2);
    var month = ("0" + (dt.getMonth() + 1)).slice(-2);
    var year = dt.getFullYear();
    var hours = ("0" + dt.getHours()).slice(-2);
    var minutes = ("0" + dt.getMinutes()).slice(-2);
    var seconds = ("0" + dt.getSeconds()).slice(-2);

    return day + "/" + month + "/" + year + ", " + hours + ":" + minutes + ":" + seconds;
}

function getLocalLastRead()
{
    var val = getStorageValue('lastRead');
    if (val) return val;

    // Fallback parsing from DOM if sidepage menu has active bookmark
    var elMarked = document.getElementById('sidepage-item-last-marked');
    var elLink = document.getElementById('last-read-link');
    if (elMarked && elLink && elMarked.textContent && elMarked.textContent.indexOf('Belum Ada') === -1) {
        var href = elLink.getAttribute('href') || '';
        var match = href.match(/\/([0-9]+)\/(?:#no([0-9]+))?/);
        if (match && match[1] && match[2]) {
            var textMatch = elMarked.textContent.match(/Surah\s+(.+?)\s+ayat/i);
            var surahName = textMatch ? textMatch[1].trim() : '';
            if (surahName) {
                var extracted = surahName + ',' + match[1] + ',' + match[2];
                setStorageValue('lastRead', extracted);
                return extracted;
            }
        }
    }
    return null;
}

function getLocalLastReadJuz()
{
    var val = getStorageValue('lastReadJuz');
    if (val) return val;

    // Fallback parsing from DOM if sidepage menu has active juz bookmark
    var elMarked = document.getElementById('sidepage-item-last-marked-juz');
    var elLink = document.getElementById('last-read-juz-link');
    if (elMarked && elLink && elMarked.textContent && elMarked.textContent.indexOf('Belum Ada') === -1) {
        var href = elLink.getAttribute('href') || '';
        var match = href.match(/\/juz\/([0-9]+)\/(?:.*#s([0-9]+)-a([0-9]+))?/);
        if (match && match[1] && match[2] && match[3]) {
            var textMatch = elMarked.textContent.match(/Surah\s+(.+?)\s+ayat/i);
            var surahName = textMatch ? textMatch[1].trim() : '';
            if (surahName) {
                var extracted = match[1] + ',' + surahName + ',' + match[2] + ',' + match[3];
                setStorageValue('lastReadJuz', extracted);
                return extracted;
            }
        }
    }
    return null;
}

function exportLocalConfig()
{
    var favs = [];
    try {
        favs = JSON.parse(localStorage.getItem('quran_favorites')) || [];
    } catch (e) {}

    var floatPos = null;
    try {
        floatPos = JSON.parse(localStorage.getItem('quran_floating_nav_pos')) || null;
    } catch (e) {}

    var lastReadTs = parseInt(localStorage.getItem('quran_last_read_updated_at') || '0', 10);
    var lastReadJuzTs = parseInt(localStorage.getItem('quran_last_read_juz_updated_at') || '0', 10);
    var favsTs = parseInt(localStorage.getItem('quran_favorites_updated_at') || '0', 10);
    var settingsTs = parseInt(localStorage.getItem('quran_settings_updated_at') || '0', 10);

    var now = Date.now();
    if (!lastReadTs && getLocalLastRead()) {
        lastReadTs = now;
        try { localStorage.setItem('quran_last_read_updated_at', now.toString()); } catch (e) {}
    }
    if (!lastReadJuzTs && getLocalLastReadJuz()) {
        lastReadJuzTs = now;
        try { localStorage.setItem('quran_last_read_juz_updated_at', now.toString()); } catch (e) {}
    }
    if (!favsTs && favs.length > 0) {
        favsTs = now;
        try { localStorage.setItem('quran_favorites_updated_at', now.toString()); } catch (e) {}
    }
    if (!settingsTs) {
        settingsTs = now;
        try { localStorage.setItem('quran_settings_updated_at', now.toString()); } catch (e) {}
    }

    return {
        lastRead: getLocalLastRead(),
        lastReadJuz: getLocalLastReadJuz(),
        nightMode: isStorageExists('nightMode', '1') ? '1' : (isStorageExists('nightMode', '0') ? '0' : null),
        useTranslation: isStorageExists('useTranslation', '0') ? '0' : '1',
        fontSize: getStorageValue('fontSize'),
        reciterIndex: getStorageValue('reciterIndex'),
        murottalMode: getStorageValue('murottalMode'),
        ayahSelection: getStorageValue('ayahSelection'),
        favorites: favs,
        floatingNavPos: floatPos,
        timestamps: {
            lastRead: lastReadTs,
            lastReadJuz: lastReadJuzTs,
            favorites: favsTs,
            settings: settingsTs
        }
    };
}

function triggerAutoSync()
{
    var code = localStorage.getItem('quran_sync_code');
    if (!code) return;

    fetch(SYNC_API_URL + '/sync/' + encodeURIComponent(code), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: exportLocalConfig() })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data && data.success) {
            if (data.data) {
                applyImportedConfig(data.data, false);
            }
            var nowStr = formatSyncDateTime(new Date());
            localStorage.setItem('quran_sync_last_time', nowStr);
            var timeEl = document.getElementById('sync-status-time');
            if (timeEl) timeEl.textContent = 'Terakhir disinkron: ' + nowStr;
        }
    })
    .catch(function(err) {
        console.error('AutoSync Background Error:', err);
    });
}

function applyImportedConfig(config, forceAll)
{
    if (!config || typeof config !== 'object') {
        return false;
    }

    var incomingTs = config.timestamps || {};
    var localLastReadTs = parseInt(localStorage.getItem('quran_last_read_updated_at') || '0', 10);
    var localLastReadJuzTs = parseInt(localStorage.getItem('quran_last_read_juz_updated_at') || '0', 10);
    var localFavTs = parseInt(localStorage.getItem('quran_favorites_updated_at') || '0', 10);
    var localSettingsTs = parseInt(localStorage.getItem('quran_settings_updated_at') || '0', 10);

    // 1. lastRead (Penanda Surah)
    var allowLastRead = forceAll || !config.timestamps || (Number(incomingTs.lastRead) || 0) >= localLastReadTs;
    if (allowLastRead && config.lastRead) {
        try {
            setStorageValue('lastRead', config.lastRead, true);
            if (incomingTs.lastRead) {
                localStorage.setItem('quran_last_read_updated_at', incomingTs.lastRead.toString());
            }
            var ayahInfo = config.lastRead.split(',');
            if (ayahInfo.length >= 3) {
                var elLastMarked = document.getElementById('sidepage-item-last-marked');
                var elLastReadLink = document.getElementById('last-read-link');
                if (elLastMarked) elLastMarked.innerHTML = 'Surah ' + ayahInfo[0] + ' ayat ' + ayahInfo[2];
                if (elLastReadLink) elLastReadLink.href = '{{BASE_URL}}/' + ayahInfo[1] + '/#no' + ayahInfo[2];
            }
        } catch (e) {
            console.error('Error applying lastRead:', e);
        }
    }

    // 2. lastReadJuz (Penanda Juz)
    var allowLastReadJuz = forceAll || !config.timestamps || (Number(incomingTs.lastReadJuz) || 0) >= localLastReadJuzTs;
    if (allowLastReadJuz && config.lastReadJuz) {
        try {
            setStorageValue('lastReadJuz', config.lastReadJuz, true);
            if (incomingTs.lastReadJuz) {
                localStorage.setItem('quran_last_read_juz_updated_at', incomingTs.lastReadJuz.toString());
            }
            var juzInfo = config.lastReadJuz.split(',');
            if (juzInfo.length >= 4) {
                var elLastMarkedJuz = document.getElementById('sidepage-item-last-marked-juz');
                var elLastReadJuzLink = document.getElementById('last-read-juz-link');
                if (elLastMarkedJuz) elLastMarkedJuz.innerHTML = 'Juz ' + juzInfo[0] + ' - Surah ' + juzInfo[1] + ' ayat ' + juzInfo[3];
                if (elLastReadJuzLink) elLastReadJuzLink.href = '{{BASE_URL}}/juz/' + juzInfo[0] + '/#s' + juzInfo[2] + '-a' + juzInfo[3];
            }
        } catch (e) {
            console.error('Error applying lastReadJuz:', e);
        }
    }

    // 3. Settings (nightMode, useTranslation, fontSize, reciterIndex, murottalMode, ayahSelection, floatingNavPos)
    var allowSettings = forceAll || !config.timestamps || (Number(incomingTs.settings) || 0) >= localSettingsTs;
    if (allowSettings) {
        if (incomingTs.settings) {
            try { localStorage.setItem('quran_settings_updated_at', incomingTs.settings.toString()); } catch (e) {}
        }
        try {
            if (config.nightMode !== null && typeof config.nightMode !== 'undefined') {
                var isNight = (config.nightMode === '1');
                setStorageValue('nightMode', config.nightMode, true);
                if (typeof applyNightMode === 'function') {
                    applyNightMode(isNight);
                }
                var nmBox = document.getElementById('nightmode');
                if (nmBox) nmBox.checked = isNight;
            }
        } catch (e) {
            console.error('Error applying nightMode:', e);
        }

        try {
            if (config.useTranslation !== null && typeof config.useTranslation !== 'undefined') {
                var isTrans = (config.useTranslation !== '0');
                setStorageValue('useTranslation', config.useTranslation, true);
                if (typeof applyTranslation === 'function') {
                    applyTranslation(isTrans);
                }
                var transBox = document.getElementById('translation');
                if (transBox) transBox.checked = isTrans;
            }
        } catch (e) {
            console.error('Error applying useTranslation:', e);
        }

        try {
            if (config.fontSize) {
                setStorageValue('fontSize', config.fontSize, true);
                var scale = parseInt(config.fontSize);
                if (!isNaN(scale) && typeof applyFontSize === 'function') {
                    applyFontSize(scale);
                }
            }
        } catch (e) {
            console.error('Error applying fontSize:', e);
        }

        try {
            if (config.reciterIndex !== null && typeof config.reciterIndex !== 'undefined') {
                setStorageValue('reciterIndex', config.reciterIndex, true);
                var reciterEl = document.getElementById('murottal-reciter');
                if (reciterEl) reciterEl.selectedIndex = parseInt(config.reciterIndex) || 0;
            }
        } catch (e) {
            console.error('Error applying reciterIndex:', e);
        }

        try {
            if (config.murottalMode) {
                setStorageValue('murottalMode', config.murottalMode, true);
                var opt = document.getElementById('murottal-mode-' + config.murottalMode);
                if (opt) opt.checked = true;
            }
        } catch (e) {
            console.error('Error applying murottalMode:', e);
        }

        try {
            if (config.ayahSelection) {
                setStorageValue('ayahSelection', config.ayahSelection, true);
                var inputSel = document.getElementById('ayah-selection-input');
                if (inputSel) inputSel.value = config.ayahSelection;
            }
        } catch (e) {
            console.error('Error applying ayahSelection:', e);
        }

        try {
            if (config.floatingNavPos) {
                var posData = JSON.stringify(config.floatingNavPos);
                localStorage.setItem('quran_floating_nav_pos', posData);
                var container = document.getElementById('floating-actions');
                if (container && config.floatingNavPos.left && config.floatingNavPos.top) {
                    container.style.left = config.floatingNavPos.left;
                    container.style.top = config.floatingNavPos.top;
                    container.style.bottom = 'auto';
                    container.style.right = 'auto';
                }
            }
        } catch (e) {
            console.error('Error applying floatingNavPos:', e);
        }
    }

    // 4. Favorites (Ayat Favorit)
    var allowFavorites = forceAll || !config.timestamps || (Number(incomingTs.favorites) || 0) >= localFavTs;
    if (allowFavorites && Array.isArray(config.favorites)) {
        try {
            localStorage.setItem('quran_favorites', JSON.stringify(config.favorites));
            if (incomingTs.favorites) {
                localStorage.setItem('quran_favorites_updated_at', incomingTs.favorites.toString());
            }
            if (typeof updateFavoriteMenuIndicator === 'function') {
                updateFavoriteMenuIndicator();
            }
            if (typeof applyClickForFavorite === 'function') {
                applyClickForFavorite();
            }
            if (typeof renderFavoritesPage === 'function') {
                renderFavoritesPage();
            }
        } catch (e) {
            console.error('Error applying favorites:', e);
        }
    }

    return true;
}

function showSyncMessage(text, type)
{
    var msgBox = document.getElementById('sync-message');
    if (!msgBox) return;

    msgBox.style.display = 'block';
    msgBox.className = 'sync-message ' + (type || '');
    msgBox.innerHTML = text;
}

function renderSyncUI()
{
    var activeCode = localStorage.getItem('quran_sync_code');
    var unlinkedBlock = document.getElementById('sync-form-unlinked');
    var linkedBlock = document.getElementById('sync-form-linked');
    var activeCodeEl = document.getElementById('sync-active-code');
    var timeEl = document.getElementById('sync-status-time');

    if (!unlinkedBlock || !linkedBlock) return;

    if (activeCode) {
        unlinkedBlock.style.display = 'none';
        linkedBlock.style.display = 'block';
        if (activeCodeEl) activeCodeEl.textContent = activeCode;
        if (timeEl) {
            var lastTime = localStorage.getItem('quran_sync_last_time');
            if (lastTime) {
                var parsedDate = new Date(lastTime);
                if (!isNaN(parsedDate.getTime())) {
                    timeEl.textContent = 'Terakhir disinkron: ' + formatSyncDateTime(parsedDate);
                } else {
                    timeEl.textContent = 'Terakhir disinkron: ' + lastTime;
                }
            } else {
                timeEl.textContent = 'Terakhir disinkron: Belum pernah';
            }
        }
    } else {
        unlinkedBlock.style.display = 'block';
        linkedBlock.style.display = 'none';
    }
}

var lastVisibilityPullTime = 0;

/**
 * Check and pull latest sync data from cloud when page becomes active or loads.
 *
 * @param boolean force
 * @return void
 */
function checkAndPullLatestSync(force)
{
    var code = localStorage.getItem('quran_sync_code');
    if (!code) return;

    var now = Date.now();
    if (!force && (now - lastVisibilityPullTime < 10000)) {
        return;
    }
    lastVisibilityPullTime = now;

    fetch(SYNC_API_URL + '/sync/' + encodeURIComponent(code))
    .then(function(res) {
        if (!res.ok) return null;
        return res.json();
    })
    .then(function(res) {
        if (res && res.success && res.data) {
            applyImportedConfig(res.data, false);
            var nowStr = formatSyncDateTime(new Date());
            localStorage.setItem('quran_sync_last_time', nowStr);
            renderSyncUI();
        }
    })
    .catch(function(err) {
        console.warn('Background auto-pull sync failed:', err);
    });
}

function initCloudSync()
{
    renderSyncUI();

    var btnConnect = document.getElementById('sync-btn-connect');
    var btnCreate = document.getElementById('sync-btn-create');
    var btnPush = document.getElementById('sync-btn-push');
    var btnPull = document.getElementById('sync-btn-pull');
    var btnCopy = document.getElementById('sync-btn-copy');
    var linkDisconnect = document.getElementById('sync-link-disconnect');
    var inputCode = document.getElementById('sync-code-input');

    if (btnConnect) {
        btnConnect.addEventListener('click', function(e) {
            e.preventDefault();
            var code = (inputCode ? inputCode.value : '').trim().toUpperCase();
            if (!code) {
                showSyncMessage('Masukkan kode sinkronisasi terlebih dahulu.', 'is-error');
                if (inputCode) inputCode.focus();
                return;
            }

            btnConnect.disabled = true;
            showSyncMessage('Menghubungkan & mengunduh data...', 'is-loading');

            fetch(SYNC_API_URL + '/sync/' + encodeURIComponent(code))
                .then(function(res) {
                    return res.json().then(function(data) {
                        return { status: res.status, data: data };
                    });
                })
                .then(function(res) {
                    btnConnect.disabled = false;
                    if (res.status === 200 && res.data.success) {
                        applyImportedConfig(res.data.data, true);
                        localStorage.setItem('quran_sync_code', code);
                        var nowStr = formatSyncDateTime(new Date());
                        localStorage.setItem('quran_sync_last_time', nowStr);
                        renderSyncUI();
                        showSyncMessage('Sinkronisasi berhasil! Data penanda baca & preferensi telah diperbarui.', 'is-success');
                    } else {
                        showSyncMessage(res.data.error || 'Kode tidak ditemukan atau gagal menghubungkan.', 'is-error');
                    }
                })
                .catch(function(err) {
                    console.error('Sync Connect Error:', err);
                    btnConnect.disabled = false;
                    showSyncMessage('Terjadi kesalahan: ' + (err.message || 'Periksa koneksi internet Anda.'), 'is-error');
                });
        });
    }

    if (btnCreate) {
        btnCreate.addEventListener('click', function(e) {
            e.preventDefault();
            var code = (inputCode ? inputCode.value : '').trim().toUpperCase();
            var payload = { data: exportLocalConfig() };
            if (code) {
                payload.code = code;
            }

            btnCreate.disabled = true;
            showSyncMessage('Mendaftarkan & mengunggah data ke cloud...', 'is-loading');

            fetch(SYNC_API_URL + '/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    return { status: res.status, data: data };
                });
            })
            .then(function(res) {
                btnCreate.disabled = false;
                if (res.status === 201 && res.data.success) {
                    var assignedCode = res.data.code;
                    localStorage.setItem('quran_sync_code', assignedCode);
                    var nowStr = formatSyncDateTime(new Date());
                    localStorage.setItem('quran_sync_last_time', nowStr);
                    if (inputCode) inputCode.value = '';
                    renderSyncUI();
                    showSyncMessage('Kode sinkronisasi berhasil dibuat: <strong>' + assignedCode + '</strong>', 'is-success');
                } else if (res.status === 409) {
                    showSyncMessage(res.data.error || 'Kode ini sudah digunakan. Silakan gunakan kode lain atau klik Hubungkan.', 'is-error');
                } else {
                    showSyncMessage(res.data.error || 'Gagal menyimpan ke cloud. Silakan coba lagi.', 'is-error');
                }
            })
            .catch(function(err) {
                console.error('Sync Create Error:', err);
                btnCreate.disabled = false;
                showSyncMessage('Terjadi kesalahan: ' + (err.message || 'Periksa koneksi internet Anda.'), 'is-error');
            });
        });
    }

    if (btnPush) {
        btnPush.addEventListener('click', function(e) {
            e.preventDefault();
            var code = localStorage.getItem('quran_sync_code');
            if (!code) return;

            btnPush.disabled = true;
            showSyncMessage('Menyimpan data terbaru ke cloud...', 'is-loading');

            fetch(SYNC_API_URL + '/sync/' + encodeURIComponent(code), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: exportLocalConfig() })
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    return { status: res.status, data: data };
                });
            })
            .then(function(res) {
                btnPush.disabled = false;
                if (res.status === 200 && res.data.success) {
                    if (res.data.data) {
                        applyImportedConfig(res.data.data, false);
                    }
                    var nowStr = formatSyncDateTime(new Date());
                    localStorage.setItem('quran_sync_last_time', nowStr);
                    renderSyncUI();
                    showSyncMessage('Data berhasil disimpan ke cloud!', 'is-success');
                } else {
                    showSyncMessage(res.data.error || 'Gagal menyimpan data ke cloud.', 'is-error');
                }
            })
            .catch(function(err) {
                console.error('Sync Push Error:', err);
                btnPush.disabled = false;
                showSyncMessage('Terjadi kesalahan: ' + (err.message || 'Periksa koneksi internet Anda.'), 'is-error');
            });
        });
    }

    if (btnPull) {
        btnPull.addEventListener('click', function(e) {
            e.preventDefault();
            var code = localStorage.getItem('quran_sync_code');
            if (!code) return;

            btnPull.disabled = true;
            showSyncMessage('Mengambil data dari cloud...', 'is-loading');

            fetch(SYNC_API_URL + '/sync/' + encodeURIComponent(code))
            .then(function(res) {
                return res.json().then(function(data) {
                    return { status: res.status, data: data };
                });
            })
            .then(function(res) {
                btnPull.disabled = false;
                if (res.status === 200 && res.data.success) {
                    applyImportedConfig(res.data.data, true);
                    var nowStr = formatSyncDateTime(new Date());
                    localStorage.setItem('quran_sync_last_time', nowStr);
                    renderSyncUI();
                    showSyncMessage('Data di perangkat ini telah diperbarui dari cloud!', 'is-success');
                } else {
                    showSyncMessage(res.data.error || 'Gagal mengambil data dari cloud.', 'is-error');
                }
            })
            .catch(function(err) {
                console.error('Sync Pull Error:', err);
                btnPull.disabled = false;
                showSyncMessage('Terjadi kesalahan: ' + (err.message || 'Periksa koneksi internet Anda.'), 'is-error');
            });
        });
    }

    if (btnCopy) {
        btnCopy.addEventListener('click', function(e) {
            e.preventDefault();
            var code = localStorage.getItem('quran_sync_code');
            if (!code) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code);
            } else {
                var temp = document.createElement('input');
                temp.value = code;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
            }

            var orig = btnCopy.textContent;
            btnCopy.textContent = 'Tersalin!';
            setTimeout(function() {
                btnCopy.textContent = orig;
            }, 2000);
        });
    }

    if (linkDisconnect) {
        linkDisconnect.addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Putuskan sinkronisasi dari perangkat ini? (Data di cloud tidak akan terhapus)')) {
                localStorage.removeItem('quran_sync_code');
                localStorage.removeItem('quran_sync_last_time');
                renderSyncUI();
                showSyncMessage('Koneksi sinkronisasi telah diputuskan dari perangkat ini.', 'is-success');
            }
            return false;
        });
    }
}

var savedScrollPosition = 0;

/**
 * Check if the given URL or href points to an anchor on the current page.
 *
 * @param String href
 * @return boolean
 */
function isSamePageAnchor(href)
{
    if (!href || href === "#" || href.indexOf("#") === -1) {
        return false;
    }
    var a = document.createElement("a");
    a.href = href;

    var norm = function(p) { return (p || "").replace(/\/+$/, "") || "/"; };
    return a.hostname === window.location.hostname &&
           norm(a.pathname) === norm(window.location.pathname);
}

/**
 * Handle bookmark click navigation from sidepage.
 * Ensures that jumping to an ayah on the current page is not overridden
 * by savedScrollPosition restoration.
 *
 * @param Event e
 * @param HTMLElement linkEl
 * @return void
 */
function handleBookmarkNavigation(e, linkEl)
{
    var href = linkEl.getAttribute("href") || linkEl.href;
    if (!href || href === "#" || href === "#sidepage") {
        return;
    }

    if (isSamePageAnchor(href)) {
        e.preventDefault();
        var targetHash = linkEl.hash || (href.indexOf("#") !== -1 ? "#" + href.split("#")[1] : "");
        var targetId = targetHash.replace("#", "");
        var targetEl = targetId ? document.getElementById(targetId) : null;

        // Clear savedScrollPosition so it will never overwrite this jump
        savedScrollPosition = null;

        closeSidepage(false);

        if (window.history && window.history.replaceState) {
            try {
                history.replaceState(null, "", targetHash);
            } catch (err) {
                window.location.hash = targetHash;
            }
        } else {
            window.location.hash = targetHash;
        }

        if (targetEl) {
            setTimeout(function() {
                try {
                    targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                } catch (err) {
                    targetEl.scrollIntoView();
                }
            }, 60);
        }
    } else {
        closeSidepage(false);
    }
}

/**
 * Scroll to target element if hash is present in URL.
 * Solves iOS WebKit / iPad font-loading reflow issues where initial hash jump stops at wrong offset.
 *
 * @return void
 */
function scrollToHashTarget()
{
    if (window.location.hash && window.location.hash.indexOf("#sidepage") === -1) {
        var targetId = window.location.hash.replace("#", "");
        var targetEl = document.getElementById(targetId);
        if (targetEl) {
            setTimeout(function() {
                try {
                    targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                } catch (err) {
                    targetEl.scrollIntoView();
                }
            }, 80);
        }
    }
}

/**
 * Open the sidepage menu without scrolling the page.
 *
 * @return void
 */
function openSidepage()
{
    var sidepage = document.getElementById('sidepage');
    if (!sidepage) {
        return;
    }

    savedScrollPosition = window.pageYOffset || document.documentElement.scrollTop || 0;
    sidepage.classList.add('is-open');

    if (window.history && window.history.pushState) {
        try {
            history.pushState({ sidepage: true }, '', '#sidepage');
        } catch (err) {
            window.location.hash = '#sidepage';
        }
    } else {
        window.location.hash = '#sidepage';
    }

    if (savedScrollPosition !== null) {
        window.scrollTo(0, savedScrollPosition);
    }
}

/**
 * Close the sidepage menu and optionally restore the previous scroll position.
 *
 * @param boolean restoreScroll Default true
 * @return void
 */
function closeSidepage(restoreScroll)
{
    var sidepage = document.getElementById('sidepage');
    if (!sidepage) {
        return;
    }

    sidepage.classList.remove('is-open');

    if (window.location.hash === '#sidepage') {
        if (window.history && window.history.replaceState) {
            try {
                history.replaceState(null, '', window.location.pathname + window.location.search);
            } catch (err) {
                window.location.hash = '';
            }
        } else {
            window.location.hash = '';
        }
    }

    if (restoreScroll !== false && savedScrollPosition !== null) {
        window.scrollTo(0, savedScrollPosition);
    }
}

/**
 * Initialize event handlers for opening and closing the sidepage.
 *
 * @return void
 */
function initSidepageEvents()
{
    var closeBtn = document.getElementById('sidepage-close-btn');
    if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            closeSidepage();
            return false;
        });
    }

    var elLastReadLink = document.getElementById('last-read-link');
    if (elLastReadLink) {
        elLastReadLink.addEventListener('click', function(e) {
            handleBookmarkNavigation(e, this);
        });
    }

    var elLastReadJuzLink = document.getElementById('last-read-juz-link');
    if (elLastReadJuzLink) {
        elLastReadJuzLink.addEventListener('click', function(e) {
            handleBookmarkNavigation(e, this);
        });
    }

    window.addEventListener('popstate', function(e) {
        var sidepage = document.getElementById('sidepage');
        if (sidepage && sidepage.classList.contains('is-open')) {
            if (window.location.hash.indexOf('#sidepage') === -1) {
                sidepage.classList.remove('is-open');
                var hashTarget = window.location.hash ? window.location.hash.replace('#', '') : '';
                var targetEl = hashTarget ? document.getElementById(hashTarget) : null;
                if (targetEl) {
                    try {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    } catch (err) {
                        targetEl.scrollIntoView();
                    }
                } else if (!hashTarget && savedScrollPosition !== null) {
                    window.scrollTo(0, savedScrollPosition);
                }
            }
        }
    });

    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
            var sidepage = document.getElementById('sidepage');
            if (sidepage && (sidepage.classList.contains('is-open') || window.location.hash === '#sidepage')) {
                closeSidepage();
            }
        }
    });
}

/**
 * Floating draggable Action Bar (Menu + Back-to-Top).
 * Default position: bottom-left.
 * Allows user to drag the component anywhere on the screen.
 * Clicking Menu opens #sidepage, clicking Back to Top scrolls smoothly to top.
 *
 * @return void
 */
function initFloatingActions()
{
    var container = document.getElementById('floating-actions');
    if (container === null) {
        return;
    }

    var isDragging = false;
    var hasMoved = false;
    var startX = 0;
    var startY = 0;
    var initialLeft = 0;
    var initialTop = 0;
    var activePointerId = null;

    // Restore saved position from localStorage
    try {
        var savedPos = localStorage.getItem('quran_floating_nav_pos') || localStorage.getItem('quran_btt_pos');
        if (savedPos) {
            var pos = JSON.parse(savedPos);
            if (pos && typeof pos.left !== 'undefined' && typeof pos.top !== 'undefined') {
                var cW = container.offsetWidth || 88;
                var cH = container.offsetHeight || 42;
                var maxL = Math.max(5, window.innerWidth - cW - 5);
                var maxT = Math.max(5, window.innerHeight - cH - 5);
                var clampL = Math.max(5, Math.min(parseFloat(pos.left), maxL));
                var clampT = Math.max(5, Math.min(parseFloat(pos.top), maxT));

                container.style.left = clampL + 'px';
                container.style.top = clampT + 'px';
                container.style.bottom = 'auto';
                container.style.right = 'auto';
            }
        }
    } catch (e) {}

    // Prevent default HTML5 drag-and-drop on desktop links
    container.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
    });

    var onPointerDown = function(e) {
        // Only accept primary mouse click (left-click) or touch
        if (typeof e.button !== 'undefined' && e.button !== 0) {
            return;
        }

        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startX = clientX;
        startY = clientY;

        var rect = container.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        isDragging = false;
        hasMoved = false;
        activePointerId = (typeof e.pointerId !== 'undefined') ? e.pointerId : null;

        window.addEventListener('pointermove', onPointerMove, { passive: false });
        window.addEventListener('pointerup', onPointerUp, { passive: false });
        window.addEventListener('pointercancel', onPointerUp, { passive: false });

        if (!window.PointerEvent) {
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('touchend', onPointerUp, { passive: false });
            window.addEventListener('touchcancel', onPointerUp, { passive: false });
        }
    };

    var onPointerMove = function(e) {
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches ? e.touches[0].clientY : e.clientY;

        var deltaX = clientX - startX;
        var deltaY = clientY - startY;

        if (!hasMoved) {
            if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
                hasMoved = true;
                isDragging = true;
                container.classList.add('is-dragging');

                // Only capture pointer AFTER movement threshold is reached
                if (activePointerId !== null && container.setPointerCapture) {
                    try {
                        container.setPointerCapture(activePointerId);
                    } catch (err) {}
                }
            }
        }

        if (hasMoved) {
            if (e.cancelable) {
                e.preventDefault();
            }

            var cW = container.offsetWidth || 88;
            var cH = container.offsetHeight || 42;
            var newLeft = initialLeft + deltaX;
            var newTop = initialTop + deltaY;

            var clampLeft = Math.max(5, Math.min(newLeft, window.innerWidth - cW - 5));
            var clampTop = Math.max(5, Math.min(newTop, window.innerHeight - cH - 5));

            container.style.left = clampLeft + 'px';
            container.style.top = clampTop + 'px';
            container.style.bottom = 'auto';
            container.style.right = 'auto';
        }
    };

    var onPointerUp = function(e) {
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);

        if (!window.PointerEvent) {
            window.removeEventListener('mousemove', onPointerMove);
            window.removeEventListener('mouseup', onPointerUp);
            window.removeEventListener('touchmove', onPointerMove);
            window.removeEventListener('touchend', onPointerUp);
            window.removeEventListener('touchcancel', onPointerUp);
        }

        if (activePointerId !== null && container.releasePointerCapture) {
            try {
                container.releasePointerCapture(activePointerId);
            } catch (err) {}
        }
        activePointerId = null;

        container.classList.remove('is-dragging');

        if (hasMoved) {
            try {
                var posData = JSON.stringify({
                    left: container.style.left,
                    top: container.style.top
                });
                localStorage.setItem('quran_floating_nav_pos', posData);
                localStorage.setItem('quran_btt_pos', posData);
                localStorage.setItem('quran_settings_updated_at', Date.now().toString());
            } catch (err) {}

            if (typeof triggerAutoSync === 'function') {
                triggerAutoSync();
            }

            // Keep hasMoved = true briefly to suppress any pending click events from dragging
            setTimeout(function() {
                hasMoved = false;
            }, 100);
        }

        isDragging = false;
    };

    if (window.PointerEvent) {
        container.addEventListener('pointerdown', onPointerDown);
    } else {
        container.addEventListener('mousedown', onPointerDown);
        container.addEventListener('touchstart', onPointerDown, { passive: false });
    }

    // Unified click handler with delegation
    container.addEventListener('click', function(e) {
        if (hasMoved) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }

        var menuBtn = e.target.closest('#floating-menu-btn');
        if (menuBtn) {
            e.preventDefault();
            openSidepage();
            return false;
        }

        var bttBtn = e.target.closest('#floating-back-to-top');
        if (bttBtn) {
            e.preventDefault();
            if (typeof window.scrollTo === 'function') {
                try {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (err) {
                    window.scrollTo(0, 0);
                }
            } else {
                document.body.scrollTop = 0;
                document.documentElement.scrollTop = 0;
            }
            return false;
        }
    });

    // Keep within bounds on window resize
    window.addEventListener('resize', function() {
        var rect = container.getBoundingClientRect();
        var cW = container.offsetWidth || 88;
        var cH = container.offsetHeight || 42;

        if (rect.right > window.innerWidth || rect.bottom > window.innerHeight) {
            var clampLeft = Math.max(5, Math.min(rect.left, window.innerWidth - cW - 5));
            var clampTop = Math.max(5, Math.min(rect.top, window.innerHeight - cH - 5));

            container.style.left = clampLeft + 'px';
            container.style.top = clampTop + 'px';
            container.style.bottom = 'auto';
            container.style.right = 'auto';
        }
    });
}

document.addEventListener('DOMContentLoaded', function(e)
{
    applyClickForBookmark();
    applyClickForBookmarkJuz();
    applyClickForFavorite();
    applyClickForMurottal();
    initFloatingActions();
    initSidepageEvents();
    initCloudSync();
    renderFavoritesPage();
    applyFavoritesSearch();
    scrollToHashTarget();

    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
            checkAndPullLatestSync();
        }
    });

    window.addEventListener('focus', function() {
        checkAndPullLatestSync();
    });

    setTimeout(function() {
        checkAndPullLatestSync();
    }, 1000);

        if (isStorageExists('nightMode', '1')) {
        applyNightMode(true);
        var nmEl = document.getElementById('nightmode');
        if (nmEl) nmEl.checked = true;
    }

    if (isStorageExists('nightMode', '0')) {
        applyNightMode(false);
        var nmEl0 = document.getElementById('nightmode');
        if (nmEl0) nmEl0.checked = false;
    }

    // Translation is enabled by default
    if (!onAyahPage) {
        if (isStorageExists('useTranslation', '0')) {
            applyTranslation(false);
            var transEl = document.getElementById('translation');
            if (transEl) transEl.checked = false;
        }
    }

    if (onAyahPage) {
        var transOnAyah = document.getElementById('translation');
        if (transOnAyah) transOnAyah.disabled = true;
    }

    // Restore saved font size from localStorage
    var savedFontSize = getStorageValue('fontSize');
    if (savedFontSize !== null) {
        var savedScale = parseInt(savedFontSize);
        if (!isNaN(savedScale) && savedScale >= FONT_SCALE_MIN && savedScale <= FONT_SCALE_MAX) {
            applyFontSize(savedScale);
        }
    }

    // Font size buttons
    var fontIncreaseBtn = document.getElementById('font-size-increase');
    var fontDecreaseBtn = document.getElementById('font-size-decrease');
    var fontResetBtn = document.getElementById('font-size-reset');

    if (fontIncreaseBtn !== null) {
        fontIncreaseBtn.onclick = function(e) {
            if (currentFontScale < FONT_SCALE_MAX) {
                applyFontSize(currentFontScale + FONT_SCALE_STEP);
                setStorageValue('fontSize', currentFontScale);
            }
            return false;
        };
    }

    if (fontDecreaseBtn !== null) {
        fontDecreaseBtn.onclick = function(e) {
            if (currentFontScale > FONT_SCALE_MIN) {
                applyFontSize(currentFontScale - FONT_SCALE_STEP);
                setStorageValue('fontSize', currentFontScale);
            }
            return false;
        };
    }

    if (fontResetBtn !== null) {
        fontResetBtn.onclick = function(e) {
            applyFontSize(FONT_SCALE_DEFAULT);
            setStorageValue('fontSize', FONT_SCALE_DEFAULT);
            return false;
        };
    }
});
