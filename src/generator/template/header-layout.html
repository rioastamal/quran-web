<!doctype html>
<html lang="id">
<head>
<title>{{TITLE}}</title>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{META}}
<style>
@font-face {
    font-family: "LPMQ";
    src: url("{{BASE_URL}}/fonts/lpmq.otf?v={{VERSION}}") format("opentype");
    font-display: swap;
}
html {
    height: 100%;
}
* {
    margin: 0;
    padding: 0;
}
body {
    font-family: "Georgia", "Arial", "Serif";
    width: 100%;
    color: #444;
    position: relative;
    min-height: 100%;
    box-sizing: border-box;
}
a, a:visited {
    text-decoration: none;
    color: inherit;
}
.header {
    width: 100%;
    box-sizing: border-box;
    display: block;
    text-align: center;
    margin-bottom: 5em;
    position: relative;
}
.header h1 {
    font-size: 1.3em;
    margin: 0 auto;
    font-weight: normal;
}
.surah-number-name {
    border-radius: 30px;
    background-color: #444;
    margin-right: 0.4em;
    color: white;
    font-size: 0.7em;
    padding: 0.1em 0.5em 0.2em 0.5em;
    top: -0.2em;
    position: relative;
}
.header h2.surah-count {
    font-size: 1em;
    font-weight: normal;
}
.header h2.page-name {
    padding-top: 0.7em;
    font-weight: normal;
    font-size: 0.9em;
    margin-bottom: 1.4em;
}
.page-wrapper {
    padding-left: 1em;
    padding-right: 1em;
}
.page-heading {
    font-size: 1.3em;
    font-weight: normal;
    margin-bottom: 0.5em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid #f1f1f1;
}
.page-wrapper p {
    line-height: 1.5em;
    margin-bottom: 0.5em;
}
.page-wrapper ul {
    margin-left: 1em;
    list-style: none;
}
.page-wrapper li {
    line-height: 1.5em;
}
.page-wrapper li:before {
    content: "•";
    padding-right: 0.5em;
}
.page-wrapper a {
    color: black;
}
.goto-ayah-wrapper {
    width: 100%;
    position: absolute;
    top: -2.4em;
    text-align: center;
}
.label-goto-ayah {
    font-size: 0.9em;
    display: inline;
}
.goto-ayah {
    appearance: none;
    -moz-appearance: none;
    -webkit-appearance: none;
    padding: 0.2em 0.5em;
    border: 1px solid #e4e4e4;
    border-top: none;
    border-right: none;
    border-left: none;
    width: 3em;
    font-size: 0.8em;
}
.ayah-toolbar {
    margin: 0.5em 0 2.8em 0;
    position: relative;
    width: 100%;
    box-sizing: border-box;
    text-align: right;
}
.icon-ayah-toolbar {
    box-sizing: border-box;
    width: 1.8em;
    height: 1.8em;
    background-color: #f1f1f1;
    font-family: sans-serif;
    display: table;
    float: right;
    text-align: center;
    margin-left: 0.3em;
    cursor: pointer;
}
.icon-content {
    display: table-cell;
    vertical-align: middle;
}
.icon-tafsir-ayah {
    padding-top: 0.1em;
}
.ayah-wrapper {
    width: 100%;
    padding-bottom: 5em;
    box-sizing: border-box;
    border-radius: 0.5em;
    position: relative;
}
.search-wrapper {
    width: 99%;
    box-sizing: border-box;
    position: inherit;
    margin-bottom: 1em;
}
.search-keywords {
    width: 100%;
    border-radius: 4px;
    font-size: 1.2em;
    border: none;
    border-bottom: 1px solid #f1f1f1;
    box-sizing: border-box;
    padding: 0.2em 0.5em;
    font-family: "Georgia", "Arial", "Serif";
    color: #444;
}
.ayah {
    margin-bottom: 0.5em;
}
.ayah-text {
    font-family: "LPMQ", "Arial", "Verdana", "Serif";
    font-size: 1.6em;
    background-color: #f1f1f1;
    position: relative;
}
.ayah-text p {
    padding: 0.5em 0.5em 0.5em 0.3em;
    line-height: 3em;
}
.ayah-translation {
    font-size: 1em;
    font-style: italic;
    padding: 1em 0em 2em;
}
.ayah-translation p {
    padding: 0.2em 0.2em 0.2em 0.5em;
    line-height: 1.8em;
}
.ayah-tafsir-wrapper {
    position: relative;
    box-sizing: border-box;
    padding: 0.2em 0.2em 0.2em 0.5em;
}
.ayah-tafsir-title {
    font-size: 1.3em;
    font-weight: normal;
    padding-bottom: 0.5em;
    border-bottom: 1px solid #e4e4e4;
}
.ayah-tafsir {
    font-size: 1em;
    padding: 1em 0.5em 0.5em 0em;
    line-height: 1.8em;
    /*white-space: pre-wrap;*/
}
.ayah-tafsir-source {
    font-size: 0.6em;
    font-style: italic;
    padding: 1em 0.5em 0.5em 0em;
    margin-top: 1em;
}
.ayah-prev-next-wrapper {
    position: relative;
    font-family: sans-serif;
    font-size: 1.5em;
    z-index: 5;
}
.ayah-prev-next-wrapper.bottom {
    margin-bottom: 2em;
    display: block;
}
.ayah-prev {
    position: absolute;
    top: -1.9em;
    left: 0.2em;
}
.ayah-next {
    position: absolute;
    top: -1.9em;
    right: 0.2em;
}
.ayah-prev.bottom,
.ayah-next.bottom {
    top: 0;
}
.ayah-number {
    font-size: 0.5em;
    padding: 0.1em 0.3em;
    background-color: #ccc;
    position: absolute;
    line-height: 1.5em;
    top: 0;
    left: 0;
    font-family: sans-serif;
}
.surah-list {
    box-sizing: border-box;
}
.surah-index {
    list-style: none;
    padding: 0.5em 0.2em 0.5em 1em;
    margin-bottom: 0.5em;
    background-color: #f1f1f1;
    position: relative;
    display: block;
}
.surah-index-name {
    display: block;
    font-size: 1.2em;
}
.surah-index-ayah {
    display: block;
    font-size: 0.75em;
}
.surah-index-number {
    position: absolute;
    font-size: 1.2em;
    right: 0.6em;
    top: 0.5em;
}
.footer {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    padding: 1em 0.5em;
    text-align: center;
    border-top: 1px solid #e4e4e4;
    color: #666;
    box-sizing: border-box;
}
.footer p {
    font-size: 0.8em;
    line-height: 1.5em;
}
.footer p a,
.footer p a:visited {
    text-decoration: none;
}
@media screen and (min-width: 720px) {
    .ayah-wrapper {
        width: 720px;
        margin: 0 auto;
    }
    .ayah-wrapper .ayah .ayah-translation p {
        padding: 0.2em 0.2em 0.2em 0em;
    }
    .goto-ayah-wrapper {
        padding-right: 0;
    }
    .ayah-tafsir-wrapper {
        padding-left: 0;
    }
    .ayah-prev {
        left: 0;
    }
    .ayah-next {
        right: 0;
    }
}
.sidepage {
    width: 100%;
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    box-sizing: border-box;
    height: 100vh;
    height: 100dvh;
    background-color: #f1f1f1;
    padding-top: 2em;
    padding-right: 2em;
    padding-bottom: 3em;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: none;
}
.sidepage-item {
    box-sizing: border-box;
    padding: 0.8em 0.3em;
    font-size: 1.2em;
    margin-left: 1em;
    border-bottom: 1px solid #ccc;
}
.sidepage-close {
    padding: 0.5em;
    position: fixed;
    top: 0;
    right: 1em;
    background-color: black;
    z-index: 25;
}
.sidepage-close a,
.sidepage-close a:visited {
    color: #f1f1f1;
    text-decoration: none;
    font-size: 1.5em;
}
.sidepage .settings span {
    margin-right: 1em;
    display: block;
    margin-bottom: 0.5em;
}
.sidepage-subitem {
    font-size: 0.7em;
    box-sizing: border-box;
    padding: 0;
    border-radius: 0.5em;
    margin-top: 1em;
}
.sidepage-item-last-marked {
    display: block;
    font-size: 0.7em;
    margin-top: 0.5em;
}
.sidepage.is-open,
.sidepage:target {
    display: block;
}
.sidepage-textbox-for-radio {
    padding: 0.2em;
    width: 75%;
    border: none;
    border-bottom: 1px solid #e4e4e4;
}
.murottal-reciter {
    appearance: none;
    -moz-appearance: none;
    -webkit-appearance: none;
    padding: 0.2em 0.5em 0.2em 0.5em;
    border: 1px solid #e4e4e4;
    border-top: none;
    border-right: none;
    border-bottom: none;
    width: 75%;
}
.input-error {
    color: #c60000;
    border-bottom: 1px solid #c60000;
}
.hide {
    display: none;
}
.report-error-message:target {
    display: block;
}
.margin-bottom-2,
p.margin-bottom-2 {
    margin-bottom: 2em;
}
.margin-bottom-half {
    margin-bottom: 0.5em
}
.margin-top-1 {
    margin-top: 1em;
}

.font-size-btn {
    display: inline-block;
    padding: 0.1em 0.4em;
    border: 1px solid #ccc;
    cursor: pointer;
    font-family: sans-serif;
    font-size: 1.2em;
    margin-top: 0.3em;
    border-radius: 4px;
    width: 18px;
    text-align: center;
}

.surah-header-in-juz {
    font-size: 1.2em;
    padding: 0.5em 0.5em 0.5em 0.3em;
    margin: 1em 0 0.5em 0;
    border-bottom: 2px solid #e4e4e4;
}

/* Begin Night Mode Specs */
.nightmode, .nightmode > div, .nightmode input, .nightmode select, .nightmode option {
    background-color: #222;
    color: #a9a9a9;
    border-color: #444;
}

.nightmode .surah-index, .nightmode .ayah-text, .nightmode .icon-ayah-toolbar {
    background-color: #333;
}


.nightmode .sidepage-item, .nightmode .ayah-tafsir-title, .nightmode .page-heading, .nightmode .surah-header-in-juz {
    border-color: #444;
}

.nightmode .ayah-number {
    background-color: #222;
}

.nightmode .page-wrapper a {
    color: #f1f1f1;
}

.nightmode .font-size-btn {
    border-color: #555;
}

/* Begin Favorite Specs */
.icon-favorite-ayah {
    color: #444;
}
.icon-favorite-ayah.is-favorite,
.icon-favorite-ayah.is-favorite .icon-content {
    color: #e53935;
}
.nightmode .icon-favorite-ayah {
    color: #a9a9a9;
}
.nightmode .icon-favorite-ayah.is-favorite,
.nightmode .icon-favorite-ayah.is-favorite .icon-content {
    color: #ef5350;
}

.favorite-surah-group {
    padding: 0.5em 0.8em 0.5em 1em;
}
.surah-index:before,
.favorite-surah-group:before,
.favorite-ayah-item:before,
.favorite-ayah-list li:before,
.favorite-surah-header:before {
    content: none !important;
    display: none !important;
}
.favorite-surah-header {
    position: relative;
    padding-bottom: 0.4em;
    margin-bottom: 0.2em;
    border-bottom: 1px solid #e0e0e0;
    padding-right: 2.2em;
}
.favorite-surah-header .surah-index-name {
    display: inline-block;
    font-size: 1.2em;
    color: inherit;
}
.favorite-surah-header .surah-index-name:hover {
    text-decoration: underline;
}
.nightmode .favorite-surah-header {
    border-bottom-color: #444;
}
.favorite-ayah-list {
    list-style: none !important;
    margin: 0 !important;
    padding: 0.2em 0 0 0 !important;
}
.favorite-ayah-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.35em 0.2em;
    margin: 0;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    list-style: none !important;
}
.favorite-ayah-item:hover {
    background-color: rgba(0, 0, 0, 0.03) !important;
}
.nightmode .favorite-ayah-item {
    background: transparent !important;
    border: none !important;
}
.nightmode .favorite-ayah-item:hover {
    background-color: rgba(255, 255, 255, 0.03) !important;
}
.favorite-ayah-link {
    font-size: 0.95em;
    color: #333;
    flex-grow: 1;
    display: inline-block;
    padding: 0.1em 0;
}
.favorite-ayah-link:hover {
    text-decoration: underline;
}
.nightmode .favorite-ayah-link {
    color: #e0e0e0;
}
.favorite-ayah-actions {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-size: 0.85em;
}
.favorite-action-link {
    color: #555;
    padding: 0.15em 0.5em;
    border: 1px solid #ccc;
    border-radius: 3px;
    background-color: #fafafa;
    text-decoration: none;
    display: inline-block;
}
.favorite-action-link:hover {
    background-color: #f0f0f0;
}
.nightmode .favorite-action-link {
    color: #ccc;
    border-color: #555;
    background-color: #333;
}
.favorite-remove-link {
    color: #c62828;
    cursor: pointer;
    padding: 0.15em 0.5em;
    border: 1px solid #ffcdd2;
    border-radius: 3px;
    background-color: #ffebee;
    text-decoration: none;
    display: inline-block;
}
.favorite-remove-link:hover {
    background-color: #ffcdd2;
}
.nightmode .favorite-remove-link {
    color: #ef9a9a;
    border-color: #5c2020;
    background-color: #381b1d;
}
.empty-favorites-box {
    text-align: center;
    padding: 3em 1em;
    color: #666;
}
.nightmode .empty-favorites-box {
    color: #aaa;
}

/* Begin Hide Translation Specs */
.notranslation .ayah-translation {
    display: none;
}

.block {
  display: block;
}

/* Begin Floating Action Dock (Menu & Back to Top) */
.floating-actions {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: inline-flex;
    align-items: center;
    background-color: #444;
    border-radius: 22px;
    z-index: 9;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    user-drag: none;
    touch-action: none;
    opacity: 0.9;
    transition: opacity 0.2s, background-color 0.2s, box-shadow 0.2s;
    cursor: grab;
    padding: 0 3px;
    height: 42px;
    box-sizing: border-box;
}
.floating-actions:hover {
    opacity: 1;
    box-shadow: 0 5px 16px rgba(0, 0, 0, 0.38);
}
.floating-actions.is-dragging {
    cursor: grabbing;
    opacity: 1;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
}
.floating-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 36px;
    color: #fff;
    text-decoration: none;
    border-radius: 18px;
    transition: background-color 0.15s ease;
    cursor: pointer;
    box-sizing: border-box;
    -webkit-user-drag: none;
    user-drag: none;
}
.floating-btn:hover {
    background-color: rgba(255, 255, 255, 0.15);
    color: #fff;
}
.floating-menu-btn {
    flex-direction: column;
    justify-content: center;
    gap: 3px;
}
.floating-linemenu {
    width: 17px;
    height: 2px;
    background-color: #fff;
    border-radius: 2px;
    display: block;
    pointer-events: none;
    transition: background-color 0.2s;
}
.floating-divider {
    width: 1px;
    height: 20px;
    background-color: rgba(255, 255, 255, 0.25);
    margin: 0 2px;
    flex-shrink: 0;
    pointer-events: none;
}
.floating-btt-btn {
    font-size: 1.35em;
    line-height: 1;
}
.floating-icon-content {
    display: inline-block;
    transform: translateY(-1px);
    pointer-events: none;
}
.nightmode .floating-actions {
    background-color: #2e2e2e;
    border: 1px solid #484848;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
}
.nightmode .floating-btn {
    color: #f1f1f1;
}
.nightmode .floating-btn:hover {
    background-color: rgba(255, 255, 255, 0.1);
    color: #fff;
}
.nightmode .floating-linemenu {
    background-color: #f1f1f1;
}
.nightmode .floating-divider {
    background-color: rgba(255, 255, 255, 0.18);
}
</style>
</head>
<body>
